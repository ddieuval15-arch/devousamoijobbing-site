<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Compteur du Quartier</title>
<style>
:root{--gold:#F5C518;--green:#1A6B3C;--card:#141414;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px;max-width:520px;margin:0 auto}
h1{font-family:Georgia,serif;font-size:24px;margin:10px 0 4px}
p.s{color:#a8a8a8;font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input{width:100%;background:#0d0d0d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:18px;margin:8px 0;letter-spacing:4px;text-align:center}
.btn{display:block;width:100%;background:var(--gold);color:#000;font-weight:800;padding:14px;border:0;border-radius:999px;font-size:16px;cursor:pointer}
.z{display:flex;justify-content:space-between;align-items:center;gap:10px}
.z h2{font-size:18px}
.z small{color:#a8a8a8;display:block;font-size:12px}
.ctl{display:flex;align-items:center;gap:14px}
.ctl button{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:28px;cursor:pointer}
.ctl button:active{background:var(--gold);color:#000}
.n{font-family:Georgia,serif;font-size:34px;min-width:60px;text-align:center}
.n.full{color:#9be3b5}
.msg{font-size:13px;min-height:18px;margin:6px 0;text-align:center;color:#a8a8a8}
.msg.err{color:#ff8c8c}
.reset{background:transparent;border:1px solid #444;color:#a8a8a8;font-size:12px;padding:6px 12px;border-radius:999px;margin-top:8px;cursor:pointer}
#panel{display:none}
</style>
</head>
<body>
<h1>Compteur du Quartier</h1>
<p class="s">Après chaque réservation confirmée, touchez + sur la zone du client. Quand une zone atteint 3, la tournée est confirmée (-25% pour tous).</p>

<div class="card" id="login">
  <label for="pin" style="font-size:13px;color:#a8a8a8">Code admin</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
  <button class="btn" id="go">Entrer</button>
  <div class="msg" id="lmsg"></div>
</div>

<div id="panel"></div>
<div class="msg" id="msg"></div>

<script>
const ZONES=[
  {id:"A",name:"Zone A",q:"Ngoyo · Tchimbamba"},
  {id:"B",name:"Zone B",q:"Mpita · Centre-ville · La Base"},
  {id:"C",name:"Zone C",q:"OCH · Tié-Tié · Fouks"}
];
const $=id=>document.getElementById(id);
let PIN=sessionStorage.getItem("bfpin")||"";
let counts={A:0,B:0,C:0};

function render(){
  $("panel").style.display="block"; $("login").style.display="none";
  $("panel").innerHTML=ZONES.map(z=>`
    <div class="card"><div class="z">
      <div><h2>${z.name}</h2><small>${z.q}</small></div>
      <div class="ctl">
        <button data-z="${z.id}" data-d="-1" aria-label="Moins">−</button>
        <div class="n ${counts[z.id]>=3?'full':''}">${counts[z.id]}/3</div>
        <button data-z="${z.id}" data-d="1" aria-label="Plus">+</button>
      </div></div>
      <button class="reset" data-z="${z.id}" data-r="1">Remettre à 0 (nouvelle tournée)</button>
    </div>`).join("");
  document.querySelectorAll("#panel button").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.r){ if(confirm("Remettre "+b.dataset.z+" à 0 ?")) send({zone:b.dataset.z,set:0}); }
    else send({zone:b.dataset.z,delta:Number(b.dataset.d)});
  }));
}

async function send(payload){
  $("msg").className="msg"; $("msg").textContent="Mise à jour…";
  try{
    const r=await fetch("/api/compteur",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin:PIN,...payload})});
    const d=await r.json();
    if(!r.ok){
      if(r.status===401){sessionStorage.removeItem("bfpin");PIN="";$("panel").style.display="none";$("login").style.display="block";$("lmsg").className="msg err";$("lmsg").textContent=d.error;}
      $("msg").className="msg err"; $("msg").textContent=d.error||"Erreur."; return;
    }
    counts=d; render(); $("msg").textContent="✓ Enregistré. Visible sur le site.";
  }catch(e){ $("msg").className="msg err"; $("msg").textContent="Pas de connexion. Réessayez."; }
}

async function start(){
  // vérifie le code en relisant le compteur puis en renvoyant la même valeur (set) pour la zone A
  try{
    const g=await (await fetch("/api/compteur")).json(); counts=g;
    const r=await fetch("/api/compteur",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin:PIN,zone:"A",set:g.A})});
    if(r.ok){ counts=await r.json(); sessionStorage.setItem("bfpin",PIN); render(); }
    else{ const d=await r.json(); $("lmsg").className="msg err"; $("lmsg").textContent=d.error||"Erreur."; }
  }catch(e){ $("lmsg").className="msg err"; $("lmsg").textContent="Pas de connexion."; }
}
$("go").addEventListener("click",()=>{PIN=$("pin").value.trim(); if(PIN) start();});
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
if(PIN) start();
</script>
</body>
</html>
